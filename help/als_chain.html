<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ALS-Chain</title><link rel="stylesheet" href="help.css"></head><body><p class="back">返回<a href="index.html">课程目录</a></p><h1>ALS-Chain</h1><p>请先理解<a href="als.html"> Almost Locked Set （ALS）</a>。 ALS-Chain 将这一概念扩展到两个以上的 ALS，并以受限共同候选依次连接。</p><p>沿链推理时，首端的取值会约束后续各组。与两个 ALS 的情形类似，可以寻找首尾 ALS 的共同候选，并从同时看见首尾两组该候选所有位置的外部格子删除它。</p><p class="back">返回<a href="index.html">课程目录</a></p></body></html>
