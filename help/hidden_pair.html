<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Hidden Pair</title><link rel="stylesheet" href="help.css"></head><body><p class="back">返回<a href="index.html">课程目录</a></p><h1>Hidden Pair</h1><p> Hidden Pair 用于删除候选数，需要先记录草稿。在一个行、列或宫中，如果两个数字只可能出现在同样的两个格子里，就可以删除这两个格子的其他候选数。</p><p>下图第 9 行的候选 5、8 只能出现在 R9C4 和 R9C9，二者必定分别占据这两个格子，因此可从 R9C9 删除 3、4、6、7。</p><img src="hidden_pair_1.png" alt="Hidden Pair示例" loading="lazy"><p class="back">返回<a href="index.html">课程目录</a></p></body></html>
