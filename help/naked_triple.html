<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Naked Triple</title><link rel="stylesheet" href="help.css"></head><body><p class="back">返回<a href="index.html">课程目录</a></p><h1>Naked Triple</h1><p>同一行、列或宫中，若三个格子的候选数合起来恰好是三个数字，且没有其他候选数，则这些数字可从该单元其他格子删除。这是<a href="naked_pair.html"> Naked Pair </a>推广到三个格子的情况。</p><p>下图中，第 5 宫的 R5C4、R6C4、R6C6 合起来只有候选 2、3、7。因此可以从 R4C4、R4C5、R4C6 和 R5C5 删除 2、3、7。</p><img src="naked_triple_1.png" alt="Naked Triple示例" loading="lazy"><p class="back">返回<a href="index.html">课程目录</a></p></body></html>
