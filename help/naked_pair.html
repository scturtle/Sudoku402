<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Naked Pair</title><link rel="stylesheet" href="help.css"></head><body><p class="back">返回<a href="index.html">课程目录</a></p><h1>Naked Pair</h1><p>同一行、列或宫中，如果两个格子都只含相同的两个候选数，就可以从该单元的其他格子中删除这两个候选数。</p><p>下图中，第 8 列的 R2C8 和 R5C8 都只有候选 2、6。无论哪个格子填 2，另一个都必须填 6，因此 R9C8 不能填 2 或 6。</p><img src="naked_pair_1.png" alt="Naked Pair示例" loading="lazy"><p class="back">返回<a href="index.html">课程目录</a></p></body></html>
