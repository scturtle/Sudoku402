<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Locked Set</title><link rel="stylesheet" href="help.css"></head><body><p class="back">返回<a href="index.html">课程目录</a></p><h1>Locked Set</h1><p> Locked Set 是同一单元中 N 个格子的候选数合起来恰好只有 N 种。</p><p>最简单的 Locked Set 是一个格子只有一个候选数，即<a href="naked_single.html"> Naked Single </a>。两个格子含两个候选数称为<a href="naked_pair.html"> Naked Pair </a>；三个格子含三个候选数称为<a href="naked_triple.html"> Naked Triple </a>；四个格子含四个候选数称为<a href="naked_quad.html"> Naked Quad </a>。这些候选数可从同一单元内其他格子删除。</p><p class="back">返回<a href="index.html">课程目录</a></p></body></html>
