<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Full House</title><link rel="stylesheet" href="help.css"></head><body><p class="back">返回<a href="index.html">课程目录</a></p><h1>Full House</h1><p>这是最基础的数独步骤。一个单元（行、列或宫）已有 8 个确定数字时，唯一的空格只能填入缺少的数字。</p><p>在下图中，第 2 行已有 8 个数字，只有 R2C8 为空，因此 R2C8 只能填 6。</p><img src="full_house_1.png" alt="Full House示例" loading="lazy"><p class="back">返回<a href="index.html">课程目录</a></p></body></html>
