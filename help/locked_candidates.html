<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Locked Candidates</title><link rel="stylesheet" href="help.css"></head><body><p class="back">返回<a href="index.html">课程目录</a></p><h1>Locked Candidates</h1><p>这是依靠单个数字删除候选的技巧，需要先记录草稿。如果数字在一个单元中只能出现在它与另一个单元的交集，就可以从第二个单元的交集以外删除这个数字。有效的交集发生在一个宫和一行或一列之间。</p><p>下图中，第 6 宫的候选 2 只能位于该宫与第 9 列的交集：R4C9、R5C9 或 R6C9。因此 R7C9 不能填 2。</p><img src="locked_candidates_1.png" alt="Locked Candidates示例" loading="lazy"><p class="back">返回<a href="index.html">课程目录</a></p></body></html>
