<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>X-Wing</title><link rel="stylesheet" href="help.css"></head><body><p class="back">返回<a href="index.html">课程目录</a></p><h1>X-Wing</h1><p> X-Wing 是利用单个数字删除候选的技巧，需要先记录草稿。如果某个数字在两行中的候选位置都只落在相同的两列，就可以从这两列的其他行删除该数字。行列互换也成立。</p><p>下图中，第 1、8 行的候选 7 都只在第 1、5 列。无论 R1C1 与 R8C5 为 7，还是 R1C5 与 R8C1 为 7，第 5 列的其他格子都不能为 7，因此可以从 R2C5 和 R9C5 删除 7。</p><img src="x_wing_1.png" alt="X-Wing示例" loading="lazy"><p class="back">返回<a href="index.html">课程目录</a></p></body></html>
